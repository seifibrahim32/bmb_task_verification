# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
# H2 creates the schema from entity annotations; no Flyway in tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway
# Disabled in tests: H2 uses Hibernate DDL instead of the SQL Server migrations
spring.flyway.enabled=false

# JWT
app.jwt.secret=TestJwtSecretKeyForHmacSha256MustBeAtLeast32BytesLong!!
app.jwt.expiration-ms=86400000

#Disable file logging during tests
logging.level.root=WARN
logging.level.com.bmb=DEBUG
