spring.application.name=bank_project

# MS SQL Server configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bank_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourPassword123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate  (Flyway owns the schema — Hibernate only validates)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway — Spring Boot auto-wires the primary DataSource automatically.
# Do NOT set spring.flyway.schemas for SQL Server (dbo is system-owned).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=5

# Show every Flyway step so any failure is immediately visible in logs
logging.level.org.flywaydb=DEBUG

# JWT
app.jwt.secret=BmBankProjectJwtSecretKeyForHmacSha256MustBe32BytesLong!
app.jwt.expiration-ms=86400000

# Swagger / SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
