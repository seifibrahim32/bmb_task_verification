# Overrides application.properties when SPRING_PROFILES_ACTIVE=docker
# Uses the docker-compose service name 'mssql' instead of 'localhost'

spring.datasource.url=jdbc:sqlserver://mssql:1433;databaseName=bank_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourPassword123

# JWT
app.jwt.secret=BmBankProjectJwtSecretKeyForHmacSha256MustBe32BytesLong!
app.jwt.expiration-ms=86400000

# Flyway — disabled in Docker; the redgate/flyway container runs migrations
# before the app starts (see docker-compose.yml flyway service).
spring.flyway.enabled=false
