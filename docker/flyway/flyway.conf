# =============================================================================
# Flyway Configuration — Docker Environment
# Mounted into the redgate/flyway container at /flyway/conf/flyway.conf
# SQL migration scripts are mounted at /flyway/sql
# =============================================================================

# JDBC connection — 'mssql' is the Docker Compose service name for SQL Server
flyway.url=jdbc:sqlserver://mssql:1433;databaseName=bank_db;encrypt=true;trustServerCertificate=true
flyway.user=sa
flyway.password=YourPassword123

# Migration scripts location inside the container
flyway.locations=filesystem:/flyway/sql

# Behaviour
flyway.validateOnMigrate=true
flyway.outOfOrder=false
flyway.connectRetries=10

# Do NOT set flyway.schemas for SQL Server — dbo is system-owned and Flyway
# will fail silently on V2+ when it tries to manage a system schema.
