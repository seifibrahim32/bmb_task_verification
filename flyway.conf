# =============================================================================
# Flyway Configuration — Local Development
# Used by: Flyway CLI  (flyway -configFiles=flyway.conf migrate)
# For Docker deployments, docker/flyway/flyway.conf is used instead.
# =============================================================================

# JDBC connection to local SQL Server instance
flyway.url=jdbc:sqlserver://localhost:1433;databaseName=bank_db;encrypt=true;trustServerCertificate=true
flyway.user=sa
flyway.password=YourPassword123

# Migration scripts location (relative to project root)
flyway.locations=filesystem:src/main/resources/db/migration

# Behaviour
flyway.validateOnMigrate=true
flyway.outOfOrder=false
flyway.connectRetries=5

# SQL Server uses dbo as the default schema — do not set flyway.schemas here
# as Flyway treats listed schemas as ones it fully owns and will try to create
# them, which fails on the system-reserved dbo schema.
